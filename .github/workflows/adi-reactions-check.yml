name: Check Adi reaction bot

on:
  push:
    branches:
      - adi-reaction-bot-24x7
    paths:
      - 'reaction-bot/**'
      - 'render-reactions.yaml'
      - '.github/workflows/adi-reactions-check.yml'
  pull_request:
    paths:
      - 'reaction-bot/**'
      - 'render-reactions.yaml'
      - '.github/workflows/adi-reactions-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: reaction-bot
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install -r requirements.txt
      - name: Offline tests
        env:
          PTB_TIMEDELTA: 'true'
        run: python -m unittest discover -s tests -v
      - name: Build container without credentials
        run: docker build --tag adi-reaction-bot-check .

# This workflow checks the code/image. The always-on host runs the worker.
